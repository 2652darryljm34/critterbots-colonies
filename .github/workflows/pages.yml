# Builds the site, runs the public ladder (examples + ladder/bots/*.py) and deploys site/ to GitHub Pages.
# Runs on push to main (after a maintainer merges a bot), nightly, and by hand.
name: pages
on:
  push: {branches: [main]}
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/build_site.py
      - run: python tools/run_ladder.py --seeds 1-6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
